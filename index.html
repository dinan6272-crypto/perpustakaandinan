
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuangBaca | Perpustakaan Digital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary:#2563eb;
  --dark:#172554;
  --light:#eff6ff;
  --bg:#f1f5f9;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;background:var(--primary);color:white;padding:11px 15px;cursor:pointer}
button:hover{opacity:.88}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:white}
textarea{min-height:85px}
header{background:var(--dark);color:white;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#60a5fa}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header-right button{background:#334b7b}
.container{max-width:1200px;margin:auto;padding:25px 18px}
.hero{background:linear-gradient(120deg,#1d4ed8,#60a5fa);padding:38px;border-radius:16px;color:white;margin-bottom:25px}
.hero h1{font-size:30px;margin-bottom:12px}
.hero p{line-height:1.7}
.message{padding:13px;border-radius:8px;margin:12px 0;background:#dbeafe;color:#1e40af;white-space:pre-wrap;font-size:14px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 15px;flex-wrap:wrap}
.search{max-width:350px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:white;border-radius:12px;overflow:hidden;border:1px solid var(--border);box-shadow:0 3px 12px #00000008}
.cover{width:100%;height:220px;object-fit:cover;background:var(--light)}
.card-body{padding:14px}
.card h3{font-size:16px;margin-bottom:8px}
.card p{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.5}
.card button{width:100%;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin:20px 0}
.stat{padding:20px;background:white;border-radius:12px;border:1px solid var(--border)}
.stat strong{display:block;color:var(--primary);font-size:28px;margin-top:10px}
.panel{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;margin:18px 0}
.panel h3{margin-bottom:15px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
nav button{background:white;color:var(--dark);border:1px solid var(--border)}
nav button.active{background:var(--primary);color:white}
.hidden{display:none!important}
label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:var(--light)}
.badge{padding:5px 9px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:11px}
.badge.green{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0f172a99;display:flex;justify-content:center;align-items:center;padding:15px;z-index:20}
.modal-box{background:white;border-radius:15px;padding:25px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal-box h2{margin-bottom:15px}
.modal-close{float:right;background:#e2e8f0;color:#334155;padding:6px 10px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1}
footer{text-align:center;color:var(--muted);padding:25px;font-size:13px}
@media(max-width:600px){
 .hero{padding:25px}.hero h1{font-size:24px}
 .container{padding:16px 12px}
 header{padding:15px}
}
</style>
</head>
<body>

<header>
  <div class="logo">📚 Ruang<span>Baca</span></div>
  <div class="header-right">
    <span id="userLabel"></span>
    <button id="loginBtn" onclick="openAuth()">Login</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Keluar</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>Selamat Datang di RuangBaca</h1>
    <p>Perpustakaan digital untuk menemukan buku, menambah wawasan, dan membangun kebiasaan membaca.</p>
  </section>

  <div id="message" class="message">Menghubungkan ke Supabase...</div>

  <section>
    <div class="section-head">
      <h2>📖 Katalog Buku</h2>
      <input id="search" class="search" placeholder="Cari judul atau penulis..." oninput="renderBooks()">
    </div>
    <div id="bookList" class="grid"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="section-head"><h2 id="dashboardTitle">Dashboard</h2></div>
    <nav id="navigation"></nav>
    <div id="dashboardContent"></div>
  </section>
</main>

<footer>© 2026 RuangBaca — Perpustakaan Digital</footer>

<div id="authModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAuth()">✕</button>
    <h2 id="authTitle">Login RuangBaca</h2>
    <div id="authMessage"></div>
    <form onsubmit="submitAuth(event)">
      <label>Email</label>
      <input id="email" type="email" required>
      <label>Password</label>
      <input id="password" type="password" required minlength="6">
      <div id="registerFields" class="hidden">
        <label>Nama lengkap</label>
        <input id="name">
        <label>Nomor telepon</label>
        <input id="phone">
      </div>
      <div class="actions">
        <button type="submit" id="authSubmit">Login</button>
        <button type="button" onclick="toggleAuth()" style="background:#64748b">Daftar</button>
      </div>
    </form>
  </div>
</div>

<div id="bookModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeBook()">✕</button>
    <h2 id="bookModalTitle">Tambah Buku</h2>
    <div id="bookMessage"></div>
    <form onsubmit="saveBook(event)">
      <input type="hidden" id="editId">
      <label>Judul buku</label>
      <input id="title" required>
      <label>Penulis</label>
      <input id="author" required>
      <label>Kategori</label>
      <select id="category" required></select>
      <label>Stok</label>
      <input id="stock" type="number" min="0" value="1" required>
      <label>Deskripsi</label>
      <textarea id="description"></textarea>
      <label>Sampul buku</label>
      <input id="cover" type="file" accept="image/*">
      <div class="actions">
        <button type="submit">Simpan</button>
        <button type="button" onclick="closeBook()" style="background:#64748b">Batal</button>
      </div>
    </form>
  </div>
</div>

<script>
"use strict";

/* KONFIGURASI SUPABASE TERBARU */
const SUPABASE_URL = "https://rxpwcqnsbuzefyyewclm.supabase.co";
const SUPABASE_KEY = "sb_publishable_SR3CIayOZezcXW3KcXTJ3A_CLOMI1gm";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
let profile = null;
let books = [];
let categories = [];
let loans = [];
let authMode = "login";
let tab = "overview";

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[c]);
}

function message(text,type="info",id="message") {
  const el=$(id);
  el.textContent=text;
  el.className="message "+(type==="error"?"error":type==="success"?"success":"");
}

function admin() {
  return profile?.role==="admin";
}

function date(value) {
  if(!value)return "-";
  return new Date(value).toLocaleDateString("id-ID");
}

/* KONEKSI */
async function init() {
  try {
    if(!window.supabase)throw new Error("Library Supabase tidak berhasil dimuat.");

    message("Memeriksa koneksi database...");

    const {error}=await db.from("books").select("id").limit(1);
    if(error)throw error;

    const {data}=await db.auth.getSession();
    session=data.session;

    if(session)await refresh();
    else {
      await loadBooks();
      message("Koneksi Supabase berhasil.","success");
    }

    db.auth.onAuthStateChange((_event,newSession)=>{
      session=newSession;
      setTimeout(async()=>{
        if(session)await refresh();
        else {
          profile=null;
          loans=[];
          updateHeader();
          $("dashboard").classList.add("hidden");
          await loadBooks();
        }
      },0);
    });

  }catch(e){
    console.error("SUPABASE ERROR:",e);
    message("Gagal menghubungkan Supabase:\n"+e.message,"error");
  }
}

/* AUTH */
function openAuth(){
  $("authModal").classList.remove("hidden");
}
function closeAuth(){
  $("authModal").classList.add("hidden");
}
function toggleAuth(){
  authMode=authMode==="login"?"register":"login";
  $("authTitle").textContent=authMode==="login"?"Login RuangBaca":"Daftar Akun";
  $("authSubmit").textContent=authMode==="login"?"Login":"Daftar";
  $("registerFields").classList.toggle("hidden",authMode!=="register");
  $("authMessage").textContent="";
}

async function submitAuth(e){
  e.preventDefault();
  const button=$("authSubmit");
  button.disabled=true;
  button.textContent="Memproses...";

  try{
    const email=$("email").value.trim();
    const password=$("password").value;
    let result;

    if(authMode==="login"){
      result=await db.auth.signInWithPassword({email,password});
    }else{
      const name=$("name").value.trim();
      const phone=$("phone").value.trim();
      if(!name)throw new Error("Nama harus diisi.");

      result=await db.auth.signUp({
        email,password,
        options:{data:{name,phone}}
      });
    }

    if(result.error)throw result.error;

    if(authMode==="register"&&!result.data.session){
      $("authMessage").textContent="Pendaftaran berhasil. Periksa email untuk konfirmasi akun.";
    }else{
      closeAuth();
      await refresh();
    }

  }catch(e){
    $("authMessage").textContent=e.message;
  }finally{
    button.disabled=false;
    button.textContent=authMode==="login"?"Login":"Daftar";
  }
}

async function logout(){
  const {error}=await db.auth.signOut();
  if(error)message(error.message,"error");
}

/* PROFIL */
async function refresh(){
  try{
    const {data:auth,error:authError}=await db.auth.getUser();
    if(authError)throw authError;
    if(!auth.user)return;

    session=(await db.auth.getSession()).data.session;

    const {data,error}=await db.from("profiles")
      .select("*").eq("id",auth.user.id).maybeSingle();

    if(error)throw error;
    profile=data;

    if(!profile){
      message("Profil belum tersedia. Periksa trigger pembuatan profil di Supabase.","error");
    }

    updateHeader();
    await loadBooks();
    await loadLoans();

    $("dashboard").classList.remove("hidden");
    $("dashboardTitle").textContent=admin()?"Dashboard Admin":"Dashboard Pembaca";
    renderDashboard();
    message("Berhasil masuk ke RuangBaca.","success");

  }catch(e){
    console.error(e);
    message("Gagal memuat akun: "+e.message,"error");
  }
}

function updateHeader(){
  const logged=!!session;
  $("loginBtn").classList.toggle("hidden",logged);
  $("logoutBtn").classList.toggle("hidden",!logged);
  $("userLabel").textContent=logged?(profile?.name||session.user.email):"";
}

/* BUKU */
async function loadBooks(){
  try{
    const {data,error}=await db.from("books")
      .select("*, categories(name)")
      .order("created_at",{ascending:false});

    if(error)throw error;
    books=data||[];
    renderBooks();

    const {data:cats,error:catError}=await db.from("categories")
      .select("*").order("name");

    if(catError)throw catError;
    categories=cats||[];

  }catch(e){
    console.error(e);
    message("Gagal memuat buku: "+e.message,"error");
  }
}

function renderBooks(){
  const keyword=$("search").value.toLowerCase().trim();
  const filtered=books.filter(b=>
    [b.title,b.author,b.categories?.name]
      .some(v=>String(v||"").toLowerCase().includes(keyword))
  );

  if(!filtered.length){
    $("bookList").innerHTML="<p>Belum ada buku ditemukan.</p>";
    return;
  }

  $("bookList").innerHTML=filtered.map(b=>`
    <article class="card">
      <img class="cover"
        src="${esc(b.cover_url||"https://placehold.co/400x550/e0ecff/1d4ed8?text=RuangBaca")}"
        onerror="this.src='https://placehold.co/400x550/e0ecff/1d4ed8?text=RuangBaca'"
        alt="Sampul buku">
      <div class="card-body">
        <h3>${esc(b.title)}</h3>
        <p>Penulis: ${esc(b.author)}</p>
        <p>Kategori: ${esc(b.categories?.name||"-")}</p>
        <p>Stok: ${b.stock}</p>
        ${admin()
          ? `<button onclick="editBook('${b.id}')">Edit Buku</button>`
          : `<button onclick="borrow('${b.id}')" ${!session||b.stock<1?"disabled":""}>Pinjam Buku</button>`
        }
      </div>
    </article>
  `).join("");
}

/* PEMINJAMAN */
async function borrow(id){
  if(!session){openAuth();return;}
  if(admin())return alert("Admin tidak dapat meminjam buku.");

  if(!confirm("Yakin ingin meminjam buku ini?"))return;

  try{
    const {error}=await db.rpc("borrow_book",{p_book_id:id});
    if(error)throw error;

    message("Buku berhasil dipinjam.","success");
    await loadBooks();
    await loadLoans();
    renderDashboard();

  }catch(e){
    message("Peminjaman gagal: "+e.message,"error");
  }
}

async function returnLoan(id){
  if(!admin())return;
  if(!confirm("Kembalikan buku ini?"))return;

  try{
    const {error}=await db.rpc("return_book",{p_loan_id:id});
    if(error)throw error;

    message("Buku berhasil dikembalikan.","success");
    await loadBooks();
    await loadLoans();
    renderDashboard();

  }catch(e){
    message("Pengembalian gagal: "+e.message,"error");
  }
}

async function loadLoans(){
  if(!session)return;

  try{
    let query=db.from("loans")
      .select("*, books(title), profiles(name,email)")
      .order("borrowed_at",{ascending:false});

    if(!admin())query=query.eq("user_id",session.user.id);

    const {data,error}=await query;
    if(error)throw error;
    loans=data||[];

  }catch(e){
    console.error(e);
    message("Gagal memuat peminjaman: "+e.message,"error");
  }
}

/* DASHBOARD */
function changeTab(value){
  tab=value;
  renderDashboard();
}

function renderDashboard(){
  if(!session)return;

  const items=admin()
    ?[["overview","Ringkasan"],["books","Kelola Buku"],["loans","Peminjaman"],["profile","Profil"]]
    :[["overview","Ringkasan"],["loans","Riwayat Saya"],["profile","Profil"]];

  $("navigation").innerHTML=items.map(([id,name])=>
    `<button class="${tab===id?"active":""}" onclick="changeTab('${id}')">${name}</button>`
  ).join("");

  if(tab==="overview"){
    const active=loans.filter(l=>l.status==="borrowed").length;
    $("dashboardContent").innerHTML=`
      <div class="stats">
        <div class="stat">Total Buku<strong>${books.length}</strong></div>
        <div class="stat">Peminjaman Aktif<strong>${active}</strong></div>
        <div class="stat">Total Riwayat<strong>${loans.length}</strong></div>
      </div>
      <div class="panel">
        <h3>Selamat datang, ${esc(profile?.name||"Pengguna")}!</h3>
        <p>Role: <b>${admin()?"Administrator":"Pembaca"}</b></p>
        <p style="margin-top:10px">Selamat menggunakan perpustakaan digital RuangBaca.</p>
      </div>`;
  }else if(tab==="books"&&admin()){
    renderAdminBooks();
  }else if(tab==="loans"){
    renderLoans();
  }else if(tab==="profile"){
    renderProfile();
  }
}

/* KELOLA BUKU */
function renderAdminBooks(){
  $("dashboardContent").innerHTML=`
    <div class="panel">
      <div class="section-head">
        <h3>Kelola Koleksi Buku</h3>
        <button onclick="openBook()">+ Tambah Buku</button>
      </div>
      <div class="table-wrap">
      <table>
        <thead><tr><th>Judul</th><th>Penulis</th><th>Kategori</th><th>Stok</th><th>Aksi</th></tr></thead>
        <tbody>${books.map(b=>`
          <tr>
            <td>${esc(b.title)}</td>
            <td>${esc(b.author)}</td>
            <td>${esc(b.categories?.name||"-")}</td>
            <td>${b.stock}</td>
            <td>
              <button onclick="editBook('${b.id}')">Edit</button>
              <button style="background:#dc2626" onclick="deleteBook('${b.id}')">Hapus</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
}

async function openBook(){
  $("bookModal").classList.remove("hidden");
  $("bookForm").reset();
  $("editId").value="";
  $("bookModalTitle").textContent="Tambah Buku";
  $("bookMessage").textContent="";

  try{
    const {data,error}=await db.from("categories").select("*").order("name");
    if(error)throw error;
    categories=data||[];
    $("category").innerHTML=categories.map(c=>
      `<option value="${c.id}">${esc(c.name)}</option>`
    ).join("");
  }catch(e){
    message(e.message,"error","bookMessage");
  }
}

function closeBook(){
  $("bookModal").classList.add("hidden");
}

async function editBook(id){
  const b=books.find(x=>String(x.id)===String(id));
  if(!b)return;

  await openBook();
  $("editId").value=b.id;
  $("title").value=b.title;
  $("author").value=b.author;
  $("category").value=b.category_id;
  $("stock").value=b.stock;
  $("description").value=b.description||"";
  $("bookModalTitle").textContent="Edit Buku";
}

async function saveBook(e){
  e.preventDefault();
  if(!admin())return;

  try{
    const id=$("editId").value;
    const payload={
      title:$("title").value.trim(),
      author:$("author").value.trim(),
      category_id:$("category").value,
      stock:Number($("stock").value),
      description:$("description").value.trim()
    };

    const file=$("cover").files[0];

    if(file){
      if(!file.type.startsWith("image/"))throw new Error("File harus gambar.");
      if(file.size>3*1024*1024)throw new Error("Ukuran maksimal 3 MB.");

      const ext=file.name.split(".").pop().toLowerCase();
      const path=crypto.randomUUID()+"."+ext;

      const {error:uploadError}=await db.storage.from("book-covers")
        .upload(path,file);

      if(uploadError)throw uploadError;

      const {data:urlData}=db.storage.from("book-covers").getPublicUrl(path);
      payload.cover_url=urlData.publicUrl;
    }

    const result=id
      ?await db.from("books").update(payload).eq("id",id)
      :await db.from("books").insert(payload);

    if(result.error)throw result.error;

    closeBook();
    message("Data buku berhasil disimpan.","success");
    await loadBooks();
    renderDashboard();

  }catch(e){
    message("Gagal menyimpan: "+e.message,"error","bookMessage");
  }
}

async function deleteBook(id){
  if(!admin())return;
  if(!confirm("Hapus buku ini?"))return;

  try{
    const {error}=await db.from("books").delete().eq("id",id);
    if(error)throw error;
    message("Buku berhasil dihapus.","success");
    await loadBooks();
    renderDashboard();
  }catch(e){
    message("Gagal menghapus buku: "+e.message,"error");
  }
}

/* RIWAYAT */
function renderLoans(){
  $("dashboardContent").innerHTML=`
    <div class="panel">
      <h3>${admin()?"Semua Peminjaman":"Riwayat Peminjaman Saya"}</h3>
      <div class="table-wrap">
      <table>
        <thead><tr>
          ${admin()?"<th>Pembaca</th>":""}
          <th>Buku</th><th>Tanggal Pinjam</th><th>Jatuh Tempo</th><th>Status</th>
          ${admin()?"<th>Aksi</th>":""}
        </tr></thead>
        <tbody>
          ${loans.length?loans.map(l=>`
            <tr>
              ${admin()?`<td>${esc(l.profiles?.name||l.profiles?.email||"-")}</td>`:""}
              <td>${esc(l.books?.title||"-")}</td>
              <td>${date(l.borrowed_at)}</td>
              <td>${date(l.due_date)}</td>
              <td><span class="badge ${l.status==="returned"?"green":""}">${esc(l.status)}</span></td>
              ${admin()?`<td>${l.status==="borrowed"?`<button onclick="returnLoan('${l.id}')">Kembalikan</button>`:"-"}</td>`:""}
            </tr>`).join(""):`<tr><td colspan="${admin()?6:4}">Belum ada riwayat.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>`;
}

/* PROFIL */
function renderProfile(){
  $("dashboardContent").innerHTML=`
    <div class="panel" style="max-width:550px">
      <h3>Profil Pengguna</h3>
      <form onsubmit="updateProfile(event)">
        <label>Nama lengkap</label>
        <input id="profileName" value="${esc(profile?.name||"")}" required>
        <label>Email</label>
        <input value="${esc(session.user.email)}" disabled>
        <label>Nomor telepon</label>
        <input id="profilePhone" value="${esc(profile?.phone||"")}">
        <label>Role</label>
        <input value="${esc(profile?.role||"reader")}" disabled>
        <button style="margin-top:15px">Simpan Profil</button>
      </form>
    </div>`;
}

async function updateProfile(e){
  e.preventDefault();
  try{
    const {error}=await db.from("profiles").update({
      name:$("profileName").value.trim(),
      phone:$("profilePhone").value.trim()
    }).eq("id",session.user.id);

    if(error)throw error;
    await refresh();
    message("Profil berhasil diperbarui.","success");
  }catch(e){
    message("Gagal memperbarui profil: "+e.message,"error");
  }
}

window.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
